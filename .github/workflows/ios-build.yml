name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build TaskBrain iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build App (Simulator / Generic iOS)
        run: |
          xcodebuild build \
            -project TaskBrain.xcodeproj \
            -scheme TaskBrain \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive Project (No Code Signing for IPA preview)
        run: |
          xcodebuild archive \
            -project TaskBrain.xcodeproj \
            -scheme TaskBrain \
            -archivePath build/TaskBrain.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskBrain-Archive
          path: build/TaskBrain.xcarchive
